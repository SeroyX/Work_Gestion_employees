<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Modifier Employé — GestionRH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<nav class="navbar">
    <div class="navbar-brand"><i class="bi bi-building"></i><span>GestionRH</span></div>
    <div class="navbar-links">
        <a th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a th:href="@{/admin/employees/new}"><i class="bi bi-person-plus"></i> Nouvel employé</a>
    </div>
    <div class="navbar-user">
        <span class="user-badge"><i class="bi bi-shield-fill"></i> Admin</span>
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <button type="submit" class="btn-logout"><i class="bi bi-box-arrow-right"></i> Déconnexion</button>
        </form>
    </div>
</nav>

<main class="main-content">

    <div class="page-header">
        <div>
            <h1 class="page-title"><i class="bi bi-pencil-square"></i> Modifier l'employé</h1>
            <p class="page-subtitle"
               th:text="'Mise à jour du profil de ' + ${employee.prenom} + ' ' + ${employee.nom}">
                Mise à jour du profil
            </p>
        </div>
        <a th:href="@{/admin/dashboard}" class="btn-secondary">
            <i class="bi bi-arrow-left"></i> Retour
        </a>
    </div>

    <div class="alert alert-error" th:if="${errorMsg}" th:text="${errorMsg}"></div>

    <form th:action="@{/admin/employees/{id}/edit(id=${employeeForm.id})}"
          th:object="${employeeForm}"
          method="post"
          class="form-card">

        <!-- Section 1 : Informations personnelles -->
        <div class="form-section">
            <h3 class="section-title"><i class="bi bi-person"></i> Informations personnelles</h3>
            <div class="form-grid-2">

                <div class="form-group">
                    <label for="nom">Nom <span class="required">*</span></label>
                    <input type="text" id="nom" th:field="*{nom}" required/>
                    <span class="field-error" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></span>
                </div>

                <div class="form-group">
                    <label for="prenom">Prénom <span class="required">*</span></label>
                    <input type="text" id="prenom" th:field="*{prenom}" required/>
                    <span class="field-error" th:if="${#fields.hasErrors('prenom')}" th:errors="*{prenom}"></span>
                </div>

                <div class="form-group">
                    <label for="age">Âge <span class="required">*</span></label>
                    <input type="number" id="age" th:field="*{age}" min="18" max="70" required/>
                    <span class="field-error" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></span>
                </div>

                <div class="form-group">
                    <label for="telephone">Téléphone</label>
                    <input type="tel" id="telephone" th:field="*{telephone}"/>
                </div>

                <div class="form-group form-grid-full">
                    <label for="adresse">Adresse</label>
                    <input type="text" id="adresse" th:field="*{adresse}"/>
                </div>

            </div>
        </div>

        <!-- Section 2 : Compte -->
        <div class="form-section">
            <h3 class="section-title"><i class="bi bi-envelope"></i> Email (identifiant)</h3>
            <div class="form-grid-2">
                <div class="form-group">
                    <label for="email">Email <span class="required">*</span></label>
                    <input type="email" id="email" th:field="*{email}" required/>
                    <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                </div>
            </div>
        </div>

        <!-- Section 3 : Poste & Département -->
        <div class="form-section">
            <h3 class="section-title"><i class="bi bi-briefcase"></i> Poste & Département</h3>
            <div class="form-grid-2">

                <div class="form-group">
                    <label for="poste">Poste</label>
                    <input type="text" id="poste" th:field="*{poste}"/>
                </div>

                <div class="form-group">
                    <label for="departement">Département</label>
                    <input type="text" id="departement" th:field="*{departement}"/>
                </div>

                <div class="form-group">
                    <label for="dateEmbauche">Date d'embauche</label>
                    <input type="date" id="dateEmbauche" th:field="*{dateEmbauche}"/>
                </div>

            </div>
        </div>

        <!-- Section 4 : Diplômes -->
        <div class="form-section">
            <h3 class="section-title"><i class="bi bi-mortarboard"></i> Diplômes</h3>
            <div id="diplomes-container">
                <div th:each="i : ${#numbers.sequence(0, #lists.size(employeeForm.diplomeIntitules) - 1)}"
                     class="diplome-row" th:id="'diplome-row-' + ${i}">
                    <div class="form-grid-3">
                        <div class="form-group">
                            <label>Intitulé</label>
                            <input type="text"
                                   th:name="'diplomeIntitules[' + ${i} + ']'"
                                   th:value="${employeeForm.diplomeIntitules[i]}"/>
                        </div>
                        <div class="form-group">
                            <label>Établissement</label>
                            <input type="text"
                                   th:name="'diplomeEtablissements[' + ${i} + ']'"
                                   th:value="${employeeForm.diplomeEtablissements[i]}"/>
                        </div>
                        <div class="form-group">
                            <label>Année</label>
                            <input type="number"
                                   th:name="'diplomeAnnees[' + ${i} + ']'"
                                   th:value="${employeeForm.diplomeAnnees[i]}"
                                   min="1950" max="2030"/>
                        </div>
                    </div>
                    <button type="button" class="btn-remove-diplome"
                            th:onclick="'removeDiplomeRow(\'diplome-row-\' + ' + ${i} + ')'">
                        <i class="bi bi-trash"></i> Supprimer
                    </button>
                </div>

                <!-- Cas où aucun diplôme n'existe encore -->
                <div th:if="${#lists.isEmpty(employeeForm.diplomeIntitules)}"
                     class="diplome-row" id="diplome-row-0">
                    <div class="form-grid-3">
                        <div class="form-group">
                            <label>Intitulé</label>
                            <input type="text" name="diplomeIntitules[0]" placeholder="Master Informatique"/>
                        </div>
                        <div class="form-group">
                            <label>Établissement</label>
                            <input type="text" name="diplomeEtablissements[0]" placeholder="Université"/>
                        </div>
                        <div class="form-group">
                            <label>Année</label>
                            <input type="number" name="diplomeAnnees[0]" placeholder="2020" min="1950" max="2030"/>
                        </div>
                    </div>
                </div>
            </div>

            <button type="button" class="btn-add-diplome" onclick="addDiplome()">
                <i class="bi bi-plus-circle"></i> Ajouter un diplôme
            </button>
        </div>

        <div class="form-actions">
            <a th:href="@{/admin/dashboard}" class="btn-secondary">
                <i class="bi bi-x"></i> Annuler
            </a>
            <button type="submit" class="btn-primary">
                <i class="bi bi-check-circle"></i> Enregistrer les modifications
            </button>
        </div>

    </form>
</main>

<footer class="footer"><p>© 2024 GestionRH</p></footer>

<script>
    let diplomeCount = document.querySelectorAll('.diplome-row').length;

    function addDiplome() {
        const container = document.getElementById('diplomes-container');
        const div = document.createElement('div');
        div.className = 'diplome-row';
        div.id = 'diplome-row-' + diplomeCount;
        div.innerHTML = `
            <div class="form-grid-3">
                <div class="form-group">
                    <label>Intitulé</label>
                    <input type="text" name="diplomeIntitules[${diplomeCount}]" placeholder="Licence"/>
                </div>
                <div class="form-group">
                    <label>Établissement</label>
                    <input type="text" name="diplomeEtablissements[${diplomeCount}]" placeholder="Université"/>
                </div>
                <div class="form-group">
                    <label>Année</label>
                    <input type="number" name="diplomeAnnees[${diplomeCount}]" placeholder="2019" min="1950" max="2030"/>
                </div>
            </div>
            <button type="button" class="btn-remove-diplome" onclick="removeDiplomeRow('diplome-row-${diplomeCount}')">
                <i class="bi bi-trash"></i> Supprimer
            </button>
        `;
        container.appendChild(div);
        diplomeCount++;
    }

    function removeDiplomeRow(id) {
        const el = document.getElementById(id);
        if (el) el.remove();
    }
</script>
</body>
</html>
