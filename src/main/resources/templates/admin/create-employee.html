<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Nouvel Employé — GestionRH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
    <div class="navbar-brand"><i class="bi bi-building"></i><span>GestionRH</span></div>
    <div class="navbar-links">
        <a th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a th:href="@{/admin/employees/new}" class="active"><i class="bi bi-person-plus"></i> Nouvel employé</a>
    </div>
    <div class="navbar-user">
        <span class="user-badge"><i class="bi bi-shield-fill"></i> Admin</span>
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <button type="submit" class="btn-logout"><i class="bi bi-box-arrow-right"></i> Déconnexion</button>
        </form>
    </div>
</nav>

<main class="main-content">

    <div class="page-header">
        <div>
            <h1 class="page-title"><i class="bi bi-person-plus-fill"></i> Nouvel Employé</h1>
            <p class="page-subtitle">Remplissez le formulaire pour créer un nouveau compte employé</p>
        </div>
        <a th:href="@{/admin/dashboard}" class="btn-secondary">
            <i class="bi bi-arrow-left"></i> Retour
        </a>
    </div>

    <div class="alert alert-error" th:if="${errorMsg}" th:text="${errorMsg}"></div>

    <form th:action="@{/admin/employees/new}"
          th:object="${employeeForm}"
          method="post"
          class="form-card"
          id="createEmployeeForm">

        <!-- ══ Section 1 : Informations personnelles ══ -->
        <div class="form-section">
            <h3 class="section-title"><i class="bi bi-person"></i> Informations personnelles</h3>
            <div class="form-grid-2">

                <div class="form-group">
                    <label for="nom">Nom <span class="required">*</span></label>
                    <input type="text" id="nom" th:field="*{nom}" placeholder="Karaoui" required/>
                    <span class="field-error" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></span>
                </div>

                <div class="form-group">
                    <label for="prenom">Prénom <span class="required">*</span></label>
                    <input type="text" id="prenom" th:field="*{prenom}" placeholder="Mohamed" required/>
                    <span class="field-error" th:if="${#fields.hasErrors('prenom')}" th:errors="*{prenom}"></span>
                </div>

                <div class="form-group">
                    <label for="age">Âge <span class="required">*</span></label>
                    <input type="number" id="age" th:field="*{age}" min="18" max="70" placeholder="30" required/>
                    <span class="field-error" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></span>
                </div>

                <div class="form-group">
                    <label for="telephone">Téléphone</label>
                    <input type="tel" id="telephone" th:field="*{telephone}" placeholder="+213 5 97 00 66 97"/>
                </div>

                <div class="form-group form-grid-full">
                    <label for="adresse">Adresse</label>
                    <input type="text" id="adresse" th:field="*{adresse}" placeholder="Hydra"/>
                </div>

            </div>
        </div>

        <!-- ══ Section 2 : Compte & Connexion ══ -->
        <div class="form-section">
            <h3 class="section-title"><i class="bi bi-key"></i> Compte & Connexion</h3>
            <div class="form-grid-2">

                <div class="form-group">
                    <label for="email">Email (identifiant) <span class="required">*</span></label>
                    <input type="email" id="email" th:field="*{email}" placeholder="mohamed@gmail.com" required/>
                    <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                </div>

                <div class="form-group">
                    <label for="motDePasse">Mot de passe initial</label>
                    <input type="text" id="motDePasse" th:field="*{motDePasse}"
                           placeholder="Laisser vide = email par défaut"/>
                    <small class="field-hint">Si vide, le mot de passe sera l'email de l'employé.</small>
                </div>

            </div>
        </div>

        <!-- ══ Section 3 : Poste & Département ══ -->
        <div class="form-section">
            <h3 class="section-title"><i class="bi bi-briefcase"></i> Poste & Département</h3>
            <div class="form-grid-2">

                <div class="form-group">
                    <label for="poste">Poste</label>
                    <input type="text" id="poste" th:field="*{poste}" placeholder="Développeur Senior"/>
                </div>

                <div class="form-group">
                    <label for="departement">Département</label>
                    <input type="text" id="departement" th:field="*{departement}" placeholder="Informatique"/>
                </div>

                <div class="form-group">
                    <label for="dateEmbauche">Date d'embauche</label>
                    <input type="date" id="dateEmbauche" th:field="*{dateEmbauche}"/>
                </div>

            </div>
        </div>

        <!-- ══ Section 4 : Diplômes ══ -->
        <div class="form-section">
            <h3 class="section-title"><i class="bi bi-mortarboard"></i> Diplômes</h3>
            <div id="diplomes-container">
                <!-- Ligne diplôme ajoutée dynamiquement -->
                <div class="diplome-row" id="diplome-0">
                    <div class="form-grid-3">
                        <div class="form-group">
                            <label>Intitulé du diplôme</label>
                            <input type="text" name="diplomeIntitules[0]" placeholder="Master Informatique"/>
                        </div>
                        <div class="form-group">
                            <label>Établissement</label>
                            <input type="text" name="diplomeEtablissements[0]" placeholder="Université Blida"/>
                        </div>
                        <div class="form-group">
                            <label>Année</label>
                            <input type="number" name="diplomeAnnees[0]" placeholder="2020" min="1950" max="2030"/>
                        </div>
                    </div>
                </div>
            </div>

            <button type="button" class="btn-add-diplome" onclick="addDiplome()">
                <i class="bi bi-plus-circle"></i> Ajouter un diplôme
            </button>
        </div>

        <!-- ══ Actions ══ -->
        <div class="form-actions">
            <a th:href="@{/admin/dashboard}" class="btn-secondary">
                <i class="bi bi-x"></i> Annuler
            </a>
            <button type="submit" class="btn-primary">
                <i class="bi bi-check-circle"></i> Créer l'employé
            </button>
        </div>

    </form>

</main>

<footer class="footer"><p>GestionEmployee Mohamed</p></footer>

<script>
    let diplomeCount = 1;

    function addDiplome() {
        const container = document.getElementById('diplomes-container');
        const div = document.createElement('div');
        div.className = 'diplome-row';
        div.id = 'diplome-' + diplomeCount;
        div.innerHTML = `
            <div class="form-grid-3">
                <div class="form-group">
                    <label>Intitulé du diplôme</label>
                    <input type="text" name="diplomeIntitules[${diplomeCount}]" placeholder="Licence Sciences"/>
                </div>
                <div class="form-group">
                    <label>Établissement</label>
                    <input type="text" name="diplomeEtablissements[${diplomeCount}]" placeholder="Université Blida"/>
                </div>
                <div class="form-group">
                    <label>Année</label>
                    <input type="number" name="diplomeAnnees[${diplomeCount}]" placeholder="2018" min="1950" max="2030"/>
                </div>
            </div>
            <button type="button" class="btn-remove-diplome" onclick="removeDiplome('diplome-${diplomeCount}')">
                <i class="bi bi-trash"></i> Supprimer
            </button>
        `;
        container.appendChild(div);
        diplomeCount++;
    }

    function removeDiplome(id) {
        const el = document.getElementById(id);
        if (el) el.remove();
    }
</script>
</body>
</html>
