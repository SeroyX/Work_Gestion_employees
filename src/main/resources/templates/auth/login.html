<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Connexion — GestionEmployee</title>
    <meta name="description" content="Connectez-vous à votre espace GestionRH"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="login-body">

<div class="login-wrapper">

    <!-- Panneau gauche décoratif -->
    <div class="login-left">
        <div class="login-left-content">
            <div class="login-logo">
                <i class="bi bi-building-fill"></i>
            </div>
            <h1>GestionEmployees</h1>
            <p>Votre plateforme de gestion des ressources humaines. Simple, rapide et sécurisée.</p>
            <div class="login-features">
                <div class="feature-item">
                    <i class="bi bi-shield-check"></i>
                    <span>Accès sécurisé par rôle</span>
                </div>
                <div class="feature-item">
                    <i class="bi bi-people"></i>
                    <span>Gestion centralisée des employés</span>
                </div>
                <div class="feature-item">
                    <i class="bi bi-file-earmark-person"></i>
                    <span>Profils complets avec diplômes</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Panneau droit : formulaire -->
    <div class="login-right">
        <div class="login-card">
            <div class="login-card-header">
                <h2>Bienvenue 👋</h2>
                <p>Connectez-vous à votre espace</p>
            </div>

            <!-- Messages d'erreur / succès -->
            <div class="alert alert-error" th:if="${errorMsg}" th:text="${errorMsg}"></div>
            <div class="alert alert-success" th:if="${logoutMsg}" th:text="${logoutMsg}"></div>

            <form th:action="@{/login}" method="post" class="login-form">

                <div class="form-group">
                    <label for="username">
                        <i class="bi bi-envelope"></i> Email
                    </label>
                    <input type="email"
                           id="username"
                           name="username"
                           placeholder="votre@email.com"
                           required
                           autocomplete="email"/>
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="bi bi-lock"></i> Mot de passe
                    </label>
                    <div class="password-wrapper">
                        <input type="password"
                               id="password"
                               name="password"
                               placeholder="••••••••"
                               required
                               autocomplete="current-password"/>
                        <button type="button"
                                class="toggle-password"
                                onclick="togglePassword()"
                                id="toggleBtn">
                            <i class="bi bi-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-primary btn-full">
                    <i class="bi bi-box-arrow-in-right"></i>
                    Se connecter
                </button>
            </form>

            <div class="login-hint">
                <i class="bi bi-info-circle"></i>
                <small>Admin : <strong>admin@entreprise.com</strong> / <strong>admin123</strong></small>
            </div>
        </div>
    </div>
</div>

<script>
    function togglePassword() {
        const pwd = document.getElementById('password');
        const icon = document.getElementById('eyeIcon');
        if (pwd.type === 'password') {
            pwd.type = 'text';
            icon.className = 'bi bi-eye-slash';
        } else {
            pwd.type = 'password';
            icon.className = 'bi bi-eye';
        }
    }
</script>
</body>
</html>
